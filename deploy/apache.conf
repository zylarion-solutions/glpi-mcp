# Apache virtual host publishing glpi-mcp (listening on 127.0.0.1:8000) over HTTPS.
#
#   sudo a2enmod proxy proxy_http headers ssl
#   sudo cp apache.conf /etc/apache2/sites-available/glpi-mcp.conf   # set ServerName first
#   sudo a2ensite glpi-mcp && sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d mcp.servicedesk.example.com              # adds the :443 copy and the redirect

<VirtualHost *:80>
    ServerName mcp.servicedesk.example.com

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # flushpackets: stream MCP responses (Server-Sent Events) without buffering
    ProxyPass        / http://127.0.0.1:8000/ flushpackets=on timeout=300
    ProxyPassReverse / http://127.0.0.1:8000/

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"

    ErrorLog ${APACHE_LOG_DIR}/glpi-mcp-error.log
    CustomLog ${APACHE_LOG_DIR}/glpi-mcp-access.log combined
</VirtualHost>
