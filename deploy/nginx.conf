# Nginx server block publishing glpi-mcp (listening on 127.0.0.1:8000) over HTTPS.
#
#   sudo cp nginx.conf /etc/nginx/sites-available/glpi-mcp   # set server_name first
#   sudo ln -s /etc/nginx/sites-available/glpi-mcp /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mcp.servicedesk.example.com      # adds TLS and the redirect

server {
    listen 80;
    server_name mcp.servicedesk.example.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Stream MCP responses (Server-Sent Events) without buffering
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
}
