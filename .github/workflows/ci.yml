name: CI

# Calidad propia del repo. La llama qa.yml (Estándar QA, en cada PR y en cada push a main).
on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  test:
    name: Tipos, pruebas y build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run ci

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t glpi-mcp:ci .
      - name: La imagen arranca y responde /healthz
        run: |
          docker run -d --name mcp -p 8000:8000 -e GLPI_URL=https://glpi.invalid -e GLPI_APP_TOKEN=ci -e GLPI_USER_TOKEN=ci -e MCP_AUTH_TOKEN=solo-para-ci glpi-mcp:ci
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/healthz && exit 0; sleep 1; done
          docker logs mcp; exit 1
